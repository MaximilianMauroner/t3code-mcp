[package]
name = "t3-code-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[[bin]]
name = "t3-code-mcp"
path = "src/main.rs"

[dependencies]
bytes = "1"
http = "1"
http-body-util = "0.1"
http-body = "1"
rmcp = { version = "=3.5.1", features = ["client", "transport-io", "transport-streamable-http-client-reqwest", "transport-streamable-http-server"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal", "sync", "time"] }
tower = { version = "0.5", features = ["util"] }

