[package]
name = "t3-code-mcp"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"

[[bin]]
name = "t3-code-mcp"
path = "src/main.rs"

[dependencies]
bytes = "1"
base64 = "0.23.1"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
fancy-regex = "0.16"
futures-util = "0.3"
getrandom = "0.4"
http = "1"
http-body-util = "0.1"
http-body = "1"
hyper = { version = "1", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["http1", "server", "tokio"] }
indexmap = { version = "2", features = ["serde"] }
libc = "0.2"
regex = "1"
regress = { version = "0.11.1", default-features = false, features = ["std"] }
reqwest = { version = "0.13.2", default-features = false, features = ["json", "stream", "rustls"] }
ryu-js = "1"
rpassword = "7.5.4"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "arbitrary_precision", "raw_value"] }
sha2 = "0.10"
tokio = { version = "1", features = ["io-std", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-tungstenite = { version = "0.28", features = ["rustls-tls-webpki-roots"] }
tokio-util = "0.7"
url = "2"
uuid = { version = "1", features = ["v4"] }

